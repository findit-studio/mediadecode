[package]
name        = "mediaio-timeline"
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/mediaio-timeline"
description = "The editing timeline as data: tracks, clips at explicit record positions, gain and fades, dissolves; validation that refuses by name, a diff, and OpenTimelineIO export. Pure Rust, no_std + alloc, no FFmpeg."
keywords   = ["timeline", "otio", "editing", "media", "no-std"]
categories = ["multimedia", "multimedia::video", "multimedia::audio", "no-std"]

[dependencies]
mediatime = { version = "0.5", default-features = false, features = ["serde"] }
serde     = { workspace = true, features = ["alloc"] }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
