name: CI / mediadecode

# Triggered by changes to the `mediadecode` core crate, the pure
# `mediaio-timeline` crate, shared workspace files, or this workflow
# itself. The two adapter workflows (`ci-ffmpeg.yml`,
# `ci-webcodecs.yml`) include `mediadecode/**` in their own triggers,
# so a change to the core crate fans out across all three workflows.
# The `timeline*` jobs are `mediaio-timeline`'s lanes.
on:
  push:
    branches: [main]
    paths:
      - 'mediadecode/**'
      - 'mediaio-timeline/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/workflows/ci-core.yml'
  pull_request:
    paths:
      - 'mediadecode/**'
      - 'mediaio-timeline/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/workflows/ci-core.yml'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt -p mediadecode -- --check

  clippy:
    name: clippy
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy -p mediadecode --each-feature --exclude-no-default-features

  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build -p mediadecode --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build -p mediadecode --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-core-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-core-build-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build -p mediadecode --feature-powerset --exclude-no-default-features

  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-core-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-core-test-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test -p mediadecode --feature-powerset --exclude-no-default-features

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: ASAN / LSAN / MSAN / TSAN
        run: bash ci/sanitizer.sh

  miri-tb:
    name: miri-tb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: s390x-unknown-linux-gnu }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-miri-
      - name: Miri
        run: bash ci/miri_tb.sh "${{ matrix.target }}"

  miri-sb:
    name: miri-sb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: s390x-unknown-linux-gnu }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-miri-
      - name: Miri
        run: bash ci/miri_sb.sh "${{ matrix.target }}"

  # `mediaio-timeline`: pure Rust, `no_std` + `alloc`, no features. Its
  # tests are the unit laws, the integration laws (the hand-predicted
  # OTIO goldens among them), the seeded properties and the doc tests.
  timeline:
    name: timeline (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-timeline-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-timeline-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
    - name: Check formatting
      run: cargo fmt -p mediaio-timeline -- --check
    - name: Apply clippy lints
      run: cargo clippy -p mediaio-timeline --all-targets
    - name: Run tests
      run: cargo test -p mediaio-timeline
    - name: Build docs
      env:
        RUSTDOCFLAGS: -Dwarnings
      run: cargo doc -p mediaio-timeline --no-deps

  # The crate builds where there is no operating system at all
  # (`thumbv7em-none-eabihf`), on the wasm targets, and on a 32-bit and a
  # big-endian one.
  timeline-cross:
    name: timeline-cross (${{ matrix.target }})
    strategy:
      matrix:
        target:
          - thumbv7em-none-eabihf
          - wasm32-unknown-unknown
          - wasm32-wasip1
          - wasm32-wasip2
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-timeline-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-timeline-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build -p mediaio-timeline --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build -p mediaio-timeline --target ${{ matrix.target }}

  # Each target's verdict stands alone: one lane failing cancels no other.
  timeline-miri:
    name: timeline-miri-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-timeline-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-timeline-miri-
      - name: Miri
        run: bash ci/miri_tb.sh "${{ matrix.target }}" mediaio-timeline

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [rustfmt, clippy, build, cross, test, sanitizer]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-coverage-
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin -p mediadecode --all-features --run-types tests --run-types doctests --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          flags: mediadecode
