name: loc

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'COPYRIGHT'
      - 'LICENSE*'
      - '**.md'
      - '**.txt'
      - 'art'
  workflow_dispatch:

# One job counts every crate and updates the Gist once, with every file in
# that one update. Separate jobs updating one Gist at the same time were
# refused with HTTP 409.
jobs:
  loc:
    name: loc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Install tokeit
        run: cargo install tokeit --force

      - name: Count lines of code, per crate and for the workspace
        run: |
          set -euo pipefail
          for dir in mediaspine mediadecode mediaencode mediaio-ffmpeg mediadecode-ffmpeg mediaencode-ffmpeg mediadecode-webcodecs mediaio-timeline mediaio .; do
            (cd "$dir" && tokeit --lang rust)
          done

      - name: Upload the counts to the Gist
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GIST_PAT }}
          script: |
            const fs = require('fs');
            // [directory, Gist file name]
            const targets = [
              ['mediaspine', 'mediaspine'],
              ['mediadecode', 'mediadecode'],
              ['mediaencode', 'mediaencode'],
              ['mediaio-ffmpeg', 'mediaio-ffmpeg'],
              ['mediadecode-ffmpeg', 'mediadecode-ffmpeg'],
              ['mediaencode-ffmpeg', 'mediaencode-ffmpeg'],
              ['mediadecode-webcodecs', 'mediadecode-webcodecs'],
              ['mediaio-timeline', 'mediaio-timeline'],
              ['mediaio', 'mediaio'],
              ['.', 'mediaio-root'],
            ];
            const files = {};
            for (const [dir, name] of targets) {
              files[name] = { content: fs.readFileSync(`${dir}/tokeit.json`, 'utf8') };
            }
            await github.rest.gists.update({
              gist_id: '327b2a8aef9003246e45c6e47fe63937',
              files,
            });
